<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#14202b;--muted:#687785;--line:#dfe6ec;--blue:#0b68c4;--navy:#0b1b2b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
.top{position:sticky;top:0;z-index:20;background:rgba(11,27,43,.97);color:#fff;padding:12px 16px;box-shadow:0 2px 12px #0002}.brand{max-width:1180px;margin:auto;display:flex;align-items:center;gap:12px}.logo{font-weight:900;font-size:21px}.sub{font-size:12px;color:#b9c7d3}.search{margin-left:auto;width:min(360px,46vw);padding:10px 13px;border-radius:12px;border:1px solid #ffffff33;background:#ffffff12;color:#fff;outline:none}
.nav{max-width:1180px;margin:10px auto 0;display:flex;gap:7px;overflow:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{border:1px solid #ffffff28;background:#ffffff0d;color:#e6eef5;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:700;cursor:pointer}.nav button.active{background:#fff;color:#0b1b2b}
.wrap{max-width:1180px;margin:22px auto;padding:0 14px 80px}.hero{background:linear-gradient(135deg,#0b1b2b,#123c60);color:#fff;border-radius:24px;padding:26px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.kicker{color:#79dfff;font-weight:800;font-size:13px}h1{margin:7px 0 9px;font-size:clamp(30px,5vw,54px)}.desc{color:#d5e0e8;line-height:1.6}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.q{background:#ffffff12;border:1px solid #ffffff18;border-radius:15px;padding:13px}.q b{display:block;font-size:17px}.q span{font-size:11px;color:#b7c6d2}

.upgrade-card h3{margin:0 0 10px;color:#07599f;font-size:16px}

.upgrade-card ul{margin-top:2px}

@media print{.top,.linkbar button{display:none!important}body{background:#fff}.wrap{max-width:none;margin:0}.card,.hero{break-inside:avoid;box-shadow:none}}

/* Tier differentiation */
.upgrade-card{position:relative;overflow:hidden}
.upgrade-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:#0b68c4}
.upgrade-card.plus{background:linear-gradient(180deg,#fff8e8,#fffdf6);border-color:#f2cf7d}
.upgrade-card.plus::before{background:#f0a500}
.upgrade-card.plus .upgrade-label{background:#f0a500}
.upgrade-card.performance{background:linear-gradient(180deg,#fff1f3,#fff9fa);border-color:#ef9aaa}
.upgrade-card.performance::before{background:#d92f4c}
.upgrade-card.performance .upgrade-label{background:#d92f4c}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}

.legend .up{background:#fff0c7;color:#9a6200}
.legend .perf{background:#ffe0e6;color:#a01931}
.viewtabs{display:flex;gap:8px;margin:16px 0 4px;overflow:auto}
.viewtabs button{border:1px solid #ccd8e2;background:#fff;color:#294154;border-radius:12px;padding:10px 14px;font-weight:800;white-space:nowrap;cursor:pointer}
.viewtabs button.active{background:#0b1b2b;color:#fff;border-color:#0b1b2b}
.compare-intro{background:linear-gradient(135deg,#132d45,#0b68c4);color:#fff}

.comp-badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8f3ff;color:#07599f;font-size:10px;font-weight:800}
@media(max-width:760px){.compare-table{min-width:760px}}

</style></head>

const nav=document.getElementById('nav'),app=document.getElementById('app'),search=document.getElementById('search');let current=Object.keys(models)[0];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function list(title,arr,cls='third'){return `<section class="card ${cls}" data-text="${esc((title+' '+arr.join(' ')).toLowerCase())}"><h2>${title}</h2><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`}
function colors(title,arr){return `<section class="card half" data-text="${esc((title+' '+arr.flat().join(' ')).toLowerCase())}"><h2>${title}</h2><div class="colors">${arr.map(c=>`<div class="color"><div class="sw" style="background:${c[1]}"></div><b>${esc(c[0])}</b><small>${esc(c[2]||'')}</small></div>`).join('')}</div></section>`}
function specs(m){return `<section class="card full" data-text="${esc(('제원 '+m.specs.flat().join(' ')).toLowerCase())}"><h2>제원 · 효율</h2><div class="table-wrap"><table><thead><tr><th>항목</th>${m.trims.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${m.specs.map(r=>`<tr><td><b>${esc(r[0])}</b></td>${m.trims.map((_,i)=>`<td>${esc(r[i+1]||r[r.length-1]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}

function upgradeSection(name){
  const rows=upgrades[name]||[];
  if(!rows.length) return "";
  const text=("등급별 추가 사양 "+rows.map(r=>r.trim+" "+r.items.join(" ")).join(" ")).toLowerCase();
  return `<section class="card full" data-text="${esc(text)}">
    <h2>등급별 추가 사양</h2>
    <div class="legend"><span class="base">기본/공통 사양</span><span class="up">상위 트림 추가</span><span class="perf">퍼포먼스 트림 추가</span></div>
    <div class="upgrade-wrap">
      ${rows.map((r,i)=>{
        const isPerf=/Dynamic|AWD/i.test(r.trim);
        const cls=isPerf?"performance":"plus";
        const label=isPerf?"퍼포먼스 트림 추가":"상위 트림 추가";
        return `<div class="upgrade-card ${cls}">
          <span class="upgrade-label">${label}</span>
          <h3>${esc(r.trim)}</h3>
          <ul>${r.items.map(x=>`<li><b>＋</b> ${esc(x)}</li>`).join("")}</ul>
        </div>`;
      }).join("")}
    </div>
  </section>`;
}


function comparisonSection(name){
 const c=competitors[name]; if(!c) return "";
 const fields=[
   ["가격","price"],["전장×전폭×전고(mm)","size"],["축거(mm)","wheelbase"],
   ["배터리/시스템","battery"],["최고출력/시스템","power"],["최대토크","torque"],
   ["구동","drive"],["주행거리","range"],["전비/연비","eff"],["0→100km/h","zero"],["핵심 특징","point"]
 ];
 return `<section class="card full compare-intro"><span class="comp-badge">대표 경쟁차 비교</span><h2>${esc(c.focus)}</h2><p>${esc(c.note)}</p></section>
 <section class="card full"><h2>제원 · 가격 · 퍼포먼스 비교</h2><div class="table-wrap">
 <table class="compare-table"><thead><tr><th>비교 항목</th>${c.cars.map((car,i)=>`<th class="${i===0?'byd':''}">${esc(car.name)}</th>`).join("")}</tr></thead>
 <tbody>${fields.map(([label,key])=>`<tr><td><b>${label}</b></td>${c.cars.map((car,i)=>`<td class="${i===0?'byd':''} ${key==='price'?'price':''}">${esc(car[key]||'-')}</td>`).join("")}</tr>`).join("")}</tbody></table>
 </div><p class="note">※ 가격은 세제혜택·보조금·옵션 적용 여부에 따라 달라질 수 있습니다. 제조사마다 주행거리/성능 표시 기준이 다를 수 있어 동일 시험기준 수치만 직접 비교하는 것이 원칙입니다.</p></section>
 <section class="card full sales"><h2>비교 핵심 요약</h2><ul>${c.summary.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>`;
}
function renderView(name,view){
 render(name);
 setTimeout(()=>{
   const grid=document.querySelector(".grid"); if(!grid) return;
   const tabs=`<div class="viewtabs"><button id="tabSpec" class="${view!=='compare'?'active':''}" onclick="renderView('${name.replace(/'/g,"\\'")}','spec')">BYD 사양</button><button id="tabCompare" class="${view==='compare'?'active':''}" onclick="renderView('${name.replace(/'/g,"\\'")}','compare')">경쟁차종 비교</button></div>`;
   const hero=document.querySelector(".hero"); if(hero) hero.insertAdjacentHTML("afterend",tabs);
   if(view==='compare') grid.innerHTML=comparisonSection(name);
 },0);
}

function render(name){current=name;const m=models[name];[...nav.children].forEach(b=>b.classList.toggle('active',b.dataset.name===name));app.innerHTML=`<section class="hero"><div><div class="kicker">${esc(m.tag)}</div><h1>${esc(name)}</h1><div class="desc">${esc(m.summary)}</div><div style="margin-top:14px">${m.trims.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div></div><div class="quick"><div class="q"><b>${m.specs.find(x=>x[0]==='배터리')?.[1]||''}</b><span>BATTERY</span></div><div class="q"><b>${m.specs.find(x=>x[0].includes('모터 / 구동'))?.[1]||''}</b><span>DRIVE</span></div><div class="q"><b>${m.specs.find(x=>x[0].includes('주행거리'))?.[1]||''}</b><span>RANGE</span></div><div class="q"><b>${m.trims.length} TRIM</b><span>LINE-UP</span></div></div></section><div class="grid">${specs(m)}${upgradeSection(name)}${colors('외장 색상',m.colors)}${colors('내장 색상',m.interior_colors)}${list('파워트레인 · 기술',m.power,'half')}${list('외장',m.exterior,'half')}${list('내장',m.interior,'third')}${list('시트',m.seat,'third')}${list('인포테인먼트',m.infotainment,'third')}${list('안전 · ADAS',m.safety,'half')}${list('편의사양',m.convenience,'half')}<section class="card full sales" data-text="${esc(('핵심 요약 '+m.sales.join(' ')).toLowerCase())}"><h2>핵심 요약</h2><ul>${m.sales.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="card full"><div class="linkbar"><a class="btn" href="${m.url}" target="_blank" rel="noopener">BYD 공식 모델 페이지</a><button class="btn ghost" onclick="window.print()">PDF로 인쇄/저장</button><button class="btn ghost" onclick="window.scrollTo({top:0,behavior:'smooth'})">맨 위로</button></div><p class="note">색상명과 트림별 세부 사양은 공식 카탈로그/홈페이지 표기를 기준으로 정리했습니다. 색상은 화면에서 실제 도장과 다르게 보일 수 있습니다.</p></section></div>`;filter(search.value)}
Object.keys(models).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.dataset.name=n;b.onclick=()=>renderView(n,'spec');nav.appendChild(b)})
function filter(q){q=(q||'').trim().toLowerCase();document.querySelectorAll('[data-text]').forEach(el=>el.classList.toggle('hidden',q&&!el.dataset.text.includes(q)))}
search.addEventListener('input',e=>filter(e.target.value));renderView(current,'spec');
</script></body></html>
